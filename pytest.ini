[pytest]
minversion = 7.0
testpaths = tests
pythonpath = . backend frontend
addopts =
    -ra
    --cov=backend
    --cov=frontend
    --cov-report=term-missing:skip-covered
    --cov-report=json:reports/coverage.json
markers =
    caso(id, modulo, puntos): identificador del caso de prueba (matriz del informe), módulo al que pertenece y puntos que vale
